<!-- ── 2. EXECUTIVE SUMMARY ── -->
<section class="section" id="executive-summary">
  <div class="section-eyebrow">02 — Executive Summary</div>
  <h2 class="section-title">Executive Summary</h2>

  <div class="content-area">
    <!-- ↓ PASTE YOUR EXECUTIVE SUMMARY PARAGRAPHS HERE -->
    <p>During <b>Q1 2024</b>, the game acquired <b>50,000 new users</b>, providing an opportunity to evaluate how effectively players progressed from acquisition through activation, engagement, and monetization. This analysis was conducted to identify performance bottlenecks across the user journey and highlight opportunities to improve player retention and revenue generation.</p>
    <p>User acquisition remained strong throughout the quarter; however, funnel performance revealed significant losses during onboarding. While <b>81.4% of installers opened the application</b>, only <b>49.5% completed signup</b>, making the onboarding process the largest source of user attrition. By the end of the activation journey, only <b>27.3% of acquired users reached level completion</b>, indicating substantial engagement leakage before users experienced the game's core value.</p>
    <p>Monetization analysis showed further opportunities for improvement. Of the users who completed a level, <b>22.8% were exposed to a rewarded advertisement</b>, while only <b>11.2% of all acquired users ultimately claimed a reward</b>. These findings suggest that both ad exposure and reward-claim participation can be optimized to increase monetization efficiency.</p>
    <p>Acquisition channel analysis identified <b></b>Organic</b> as the highest-performing source, contributing approximately <b>40% of all level completions</b> during the quarter. Device-level analysis further indicated stronger progression among <b>Android users (57.4%)</b> compared to <b>iOS users (42.6%)</b>.</p>
    <p>The analysis indicates that the greatest opportunity for growth lies in reducing friction between <b>App Open and Signup Completion</b>, improving onboarding engagement, and increasing participation in rewarded-ad experiences. Addressing these areas has the potential to improve both player retention and monetization outcomes across the funnel.</p>
  </div>
</section>


<!-- ── 3. PROJECT OVERVIEW ── -->

  <div class="content-area">
    <!-- ↓ PASTE YOUR PROJECT OVERVIEW PARAGRAPHS HERE -->
    <p>As part of the Q1 2024 product performance review, the analytics team was tasked with evaluating how effectively newly acquired users progressed through the mobile game's lifecycle—from installation and onboarding to engagement and monetization. Understanding user behavior across this journey is critical for identifying retention bottlenecks, improving player experience, and maximizing revenue opportunities.</p>
    <p>The analysis was conducted using a user-level event dataset containing activity from 50,000 users acquired during January–March 2024. The dataset captures key behavioral events across the player journey, including app installation, app opening, signup completion, tutorial completion, level completion, advertisement exposure, and reward claiming. Additional user attributes such as acquisition channel, device type, country, session activity, and demographic information were also available to support segmentation analysis.</p>
  </div>
</section>

<script>
  // Active nav link on scroll
  const sections = document.querySelectorAll('section[id]');
  const links = document.querySelectorAll('.nav-links a');
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(a => a.classList.remove('active'));
        const a = document.querySelector(`.nav-links a[href="#${e.target.id}"]`);
        if (a) a.classList.add('active');
      }
    });
  }, { threshold: 0.5 });
  sections.forEach(s => obs.observe(s));
</script>
